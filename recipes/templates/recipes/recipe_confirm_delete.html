{% extends 'recipes/base.html' %}

{% block content %}
<div class="row mt-4">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header">Ta bort recept</div>
            <div class="card-body">
                <p>Är du säker på att du vill ta bort receptet "{{ object.title }}"?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Ja, ta bort</button>
                    <a href="{% url 'recipe_detail' object.pk %}" class="btn btn-secondary">Avbryt</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
