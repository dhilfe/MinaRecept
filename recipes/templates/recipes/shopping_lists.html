{% extends 'recipes/base.html' %}

{% block content %}
<div class="row mt-4">
    <div class="col-md-8 offset-md-2">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mb-0">Inköpslistor</h2>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <form method="post" class="row g-2 align-items-end">
                    {% csrf_token %}
                    <input type="hidden" name="action" value="create">

                    <div class="col-12 col-md-7">
                        <label class="form-label">Namn</label>
                        <input type="text" class="form-control" name="name" placeholder="t.ex. Veckohandling" required>
                    </div>
                    <div class="col-12 col-md-3">
                        <div class="form-check mt-4">
                            <input class="form-check-input" type="checkbox" name="is_recurring" id="is_recurring" value="1">
                            <label class="form-check-label" for="is_recurring">Återkommande</label>
                        </div>
                    </div>
                    <div class="col-12 col-md-2 d-grid">
                        <button type="submit" class="btn btn-primary">Skapa</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="list-group">
            {% for lst in lists %}
                <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" href="{% url 'shopping_list_detail' lst.id %}">
                    <div>
                        <div class="fw-semibold">{{ lst.name }}</div>
                        <div class="text-muted small">
                            {% if lst.is_recurring %}<span class="badge bg-secondary">Återkommande</span>{% endif %}
                            <span class="ms-1">{{ lst.unchecked_count }} kvar</span>
                        </div>
                    </div>
                    <span class="text-muted">Öppna</span>
                </a>
            {% empty %}
                <div class="list-group-item text-muted">Inga inköpslistor ännu. Skapa en ovan.</div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
