{% extends 'recipes/base.html' %}

{% block content %}
<div class="row mt-5">
    <div class="col-md-6 offset-md-3">
        <div class="card shadow">
            <div class="card-body text-center">
                <h2 class="mb-4">Bekräfta borttagning</h2>
                <p>Är du säker på att du vill ta bort receptet <strong>{{ object.title }}</strong>?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Ja, ta bort</button>
                    <a href="{% url 'recipe_detail' object.pk %}" class="btn btn-secondary ms-2">Avbryt</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
