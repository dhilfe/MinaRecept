{% extends 'recipes/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">Logga in</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <!-- Klassisk login behålls för admin/användarnamn-lösenord. -->
                    <div class="mb-3">
                        <label for="username" class="form-label">E-post</label>
                        <input type="text" class="form-control" id="username" name="username" autocomplete="username email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Lösenord</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Logga in</button>
                </form>
                <div class="mt-3 text-center">
                    <small>Glömt lösenord? Kontakta admin.</small>
                </div>
                <div class="mt-2 text-center">
                    <a href="{% url 'signup' %}">Skapa konto</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
