server {
    listen 80;
    
    # Use Docker's built-in DNS resolver to handle dynamic IP changes of containers.
    # valid=30s forces Nginx to re-resolve the name every 30 seconds.
    resolver 127.0.0.11 valid=30s;

    # Static files
    location /static/ {
        alias /app/staticfiles/;
    }

    # Media files (uploaded images)
    location /media/ {
        alias /app/media/;
    }

    # Proxy to Django app
    location / {
        # Use a variable for the upstream to force re-resolution via the resolver
        set $upstream_app http://receptapp_web:8000;
        
        proxy_pass $upstream_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        # Important: Tell Django we are using HTTPS (handled by Cloudflare Tunnel)
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        client_max_body_size 20M; # Allow larger uploads
    }
}
