# Exempel på Nginx-konfiguration för MinaRecept
# Spara som /etc/nginx/sites-available/receptapp och symlinka till sites-enabled

server {
    listen 80;
    server_name receptapp.se api.receptapp.se;

    location /static/ {
        alias /home/ubuntu/ReceptApp/static/;
    }

    location /media/ {
        alias /home/ubuntu/ReceptApp/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

